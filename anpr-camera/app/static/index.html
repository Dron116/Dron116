<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ANPR — распознавание номеров</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Roboto+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <span class="logo">ANPR</span>
        <div>
          <h1>Распознавание номеров</h1>
          <p id="source-line">Подключение к камере…</p>
        </div>
      </div>
      <div class="top-meta">
        <div class="chip" id="mode-chip">—</div>
        <div class="chip" id="count-chip">0 номеров</div>
      </div>
    </header>

    <main class="layout">
      <section class="stage">
        <div class="video-wrap">
          <img id="live" alt="Поток с камеры" src="/api/stream" />
          <div class="video-caption">
            <span id="res-label">—</span>
            <span id="clock"></span>
          </div>
        </div>
        <form id="upload-form" class="upload">
          <label class="file">
            <span id="file-label">Выбрать фото</span>
            <input type="file" id="photo" accept="image/*" />
          </label>
          <button type="submit">Распознать кадр</button>
        </form>
      </section>

      <aside class="side">
        <article class="card plate-card">
          <p class="muted">Последний номер</p>
          <div class="ru-plate" id="last-plate">
            <span class="p-letter" id="p-letter">—</span>
            <span class="p-num" id="p-num">---</span>
            <span class="p-tail" id="p-tail">--</span>
            <span class="p-reg">
              <strong id="p-reg">--</strong>
              <small>RUS</small>
            </span>
          </div>
          <p class="muted" id="last-meta">Ожидание проезда</p>
        </article>

        <article class="card">
          <div class="card-head">
            <h2>Статус камеры</h2>
          </div>
          <dl class="kv">
            <div><dt>Хост</dt><dd id="cam-host">—</dd></div>
            <div><dt>Режим</dt><dd id="cam-mode">—</dd></div>
            <div><dt>Источник</dt><dd id="cam-source">—</dd></div>
            <div><dt>Ошибка</dt><dd id="cam-error">нет</dd></div>
          </dl>
        </article>

        <article class="card">
          <div class="card-head">
            <h2>Журнал</h2>
            <button type="button" id="clear-btn" class="ghost">Очистить</button>
          </div>
          <input type="search" id="search" placeholder="Поиск по номеру" />
          <ul id="history" class="history"></ul>
        </article>
      </aside>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
